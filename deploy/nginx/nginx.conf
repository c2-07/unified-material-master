# Reverse proxy for the production stack.
#
#   /            -> frontend  (Next.js standalone, :3000)
#   /api/...     -> core-backend (Express, :4000)
#   /ml/...      -> ml-api (FastAPI legacy prototype, :8000)  [profile: ml]
#   /healthz     -> nginx's own liveness, independent of the app
#
# Only nginx publishes a port. Postgres and the API stay on the internal
# compose network.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Uploads are multipart CSV inventory imports. The backend accepts 25 MB of
    # JSON and bulk rows can be larger, so keep the body cap generous.
    client_max_body_size 50m;
    client_body_timeout  120s;

    # ── upstreams ───────────────────────────────────────────────────────────
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream core_backend {
        server core-backend:4000;
        keepalive 32;
    }

    # The ML service is an opt-in compose profile, so its name often has no DNS
    # record. nginx resolves literal upstream hostnames while loading the config
    # and treats a missing one as fatal, which would stop nginx from starting
    # whenever the profile is off. Resolving through a variable defers the
    # lookup to request time, so an absent ML service degrades to 502 on /ml/
    # instead of taking the whole proxy down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # gzip for text. Next.js compresses its own chunks, so this mainly helps
    # the JSON API and any uncompressed asset.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        image/svg+xml font/woff2;

    # Trust the forwarding headers only from our own upstreams.
    proxy_headers_hash_max_size 1024;

    server {
        listen 80 default_server;
        server_name _;

        # ── liveness ────────────────────────────────────────────────────────
        # Answers as long as nginx itself is up, which is what a load balancer
        # fronting several nginx replicas wants. App health lives on
        # /api/health, which proxies through to the backend.
        # Surface any 429 (from the backend, or from the opt-in rate limits in
        # rate-limit.conf.example) as JSON instead of nginx's HTML error page.
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"Too many requests. Please slow down and retry."}';
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── legacy ML API (opt-in: docker compose --profile ml) ─────────────
        # main.py serves its own /api/* routes, which would shadow the Express
        # backend, so it is namespaced under /ml with the prefix stripped.
        location /ml/ {
            set $ml_upstream ml-api:8000;
            rewrite ^/ml/(.*)$ /$1 break;
            proxy_pass http://$ml_upstream;
            include /etc/nginx/proxy-headers.conf;
        }

        # ── backend API ─────────────────────────────────────────────────────
        # Credential-stuffing protection on the auth endpoints.
        location /api/auth/ {
            proxy_pass http://core_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        # Inventory imports: slower and bulkier.
        location /api/cpse/ {
            proxy_pass http://core_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        location /api/ {
            proxy_pass http://core_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        # ── frontend ────────────────────────────────────────────────────────
        # Content-addressed build output: safe to cache for a year.
        location /_next/static/ {
            proxy_pass http://frontend;
            include /etc/nginx/proxy-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # App HTML must not be cached, or a client can keep a stale bundle
        # after a deploy.
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy-headers.conf;
            add_header Cache-Control "no-store" always;
        }
    }
}
