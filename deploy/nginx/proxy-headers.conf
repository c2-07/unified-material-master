# Shared snippet, included in every proxying location.
#
# Security headers live here rather than only on the server block: nginx
# discards all inherited add_header directives as soon as a location declares
# even one of its own, so headers set at server level silently vanish from any
# location that overrides Cache-Control.

proxy_http_version 1.1;

# Preserve the client's addressing. Without this every backend log line shows
# the nginx container's IP.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# Required for the upstream keepalive pools to actually be reused.
proxy_set_header Connection        "";

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# The app loads no third-party scripts and no external fonts/assets, so the
# policy can stay tight. 'unsafe-inline'/'unsafe-eval' are required by Next.js
# inlined bootstrap scripts.
add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "SAMEORIGIN" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection         "0" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
